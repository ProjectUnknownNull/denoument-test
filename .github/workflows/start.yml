name: Start Server Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Java Version
        run: java -version

      - name: Show Drives
        run: Get-PSDrive -PSProvider FileSystem

      - name: Create McFolder
        run: mkdir D:\McFolder

      - name: Verify Folder
        run: dir D:\
