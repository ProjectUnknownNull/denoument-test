name: Forge Download Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'

      - name: Verify Java
        run: java -version

      - name: Create McFolder
        run: mkdir D:\McFolder

      - name: Download Forge Installer
        run: |
          Invoke-WebRequest `
            -Uri "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-61.1.8/forge-1.21.1-61.1.8-installer.jar" `
            -OutFile "D:\McFolder\forge-installer.jar"

      - name: Verify Download
        run: dir D:\McFolder
