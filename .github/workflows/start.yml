name: Forge Start Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'

      - name: Create McFolder
        run: mkdir D:\McFolder

      - name: Download Forge Installer
        run: |
          Invoke-WebRequest `
            -Uri "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.11-61.1.8/forge-1.21.11-61.1.8-installer.jar" `
            -OutFile "D:\McFolder\forge-installer.jar"

      - name: Install Forge Server
        run: |
          cd D:\McFolder
          java -jar forge-installer.jar --installServer

      - name: Run Server
        run: |
          cd D:\McFolder
          .\run.bat
        continue-on-error: true

      - name: Show McFolder Contents
        run: dir D:\McFolder

      - name: Show EULA
        run: |
          if (Test-Path "D:\McFolder\eula.txt") {
            Get-Content "D:\McFolder\eula.txt"
          } else {
            Write-Host "No eula.txt found"
          }
