name: Forge Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'

      - name: Check Java
        run: java -version

      - name: Create McFolder
        run: |
          mkdir D:\McFolder

      - name: Download Forge Installer
        run: |
          Invoke-WebRequest `
            -Uri "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.11-61.1.8/forge-1.21.11-61.1.8-installer.jar" `
            -OutFile "D:\McFolder\forge-installer.jar"

      - name: Install Forge Server
        run: |
          cd D:\McFolder
          java -jar forge-installer.jar --installServer

      - name: First Boot
        run: |
          cd D:\McFolder
          .\run.bat
        continue-on-error: true

      - name: Accept EULA
        run: |
          (Get-Content D:\McFolder\eula.txt) `
          -replace 'eula=false','eula=true' |
          Set-Content D:\McFolder\eula.txt

      - name: Verify EULA
        run: |
          Get-Content D:\McFolder\eula.txt

      - name: Start Server In Background
        run: |
          Start-Process -FilePath "D:\McFolder\run.bat"
          Start-Sleep -Seconds 30

      - name: Show JVM Args
        run: |
          Write-Host "===== user_jvm_args.txt ====="
          Get-Content D:\McFolder\user_jvm_args.txt

      - name: Show Folder Contents
        run: |
          Write-Host "===== McFolder ====="
          dir D:\McFolder

      - name: Show Latest Log
        run: |
          if (Test-Path "D:\McFolder\logs\latest.log") {
            Write-Host "===== latest.log ====="
            Get-Content "D:\McFolder\logs\latest.log" -Tail 100
          }
          else {
            Write-Host "No latest.log found"
          }

      - name: Show Java Processes
        run: |
          Get-Process java -ErrorAction SilentlyContinue
