name: Forge Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Save Folder
        run: |
          New-Item `
            -ItemType Directory `
            -Path ".\saves" `
            -Force

      - name: Check Java
        run: java -version

      - name: Create McFolder
        run: |
          mkdir D:\McFolder

      - name: Restore World Save
        run: |
          if (Test-Path ".\saves\world.zip") {
            Write-Host "===== WORLD SAVE FOUND ====="

            Expand-Archive `
              -Path ".\saves\world.zip" `
              -DestinationPath "D:\McFolder" `
              -Force

            Write-Host "World restored!"
          }
          else {
            Write-Host "===== NO WORLD SAVE FOUND ====="
          }

      - name: Verify Restored World
        run: |
          if (Test-Path "D:\McFolder\world") {
            Write-Host "===== RESTORED WORLD ====="
            dir D:\McFolder\world
          }
          else {
            Write-Host "No world folder found"
          }

      - name: Download Forge Installer
        run: |
          Invoke-WebRequest `
            -Uri "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.11-61.1.8/forge-1.21.11-61.1.8-installer.jar" `
            -OutFile "D:\McFolder\forge-installer.jar"

      - name: Install Forge Server
        run: |
          cd D:\McFolder
          java -jar forge-installer.jar --installServer

      - name: First Boot
        continue-on-error: true
        run: |
          cd D:\McFolder
          .\run.bat

      - name: Accept EULA
        run: |
          (Get-Content D:\McFolder\eula.txt) `
          -replace 'eula=false','eula=true' |
          Set-Content D:\McFolder\eula.txt

      - name: Generate Server Properties
        continue-on-error: true
        run: |
          Start-Process `
            -FilePath "D:\McFolder\run.bat" `
            -WorkingDirectory "D:\McFolder"

          Start-Sleep -Seconds 30

      - name: Set Online Mode False
        run: |
          (Get-Content D:\McFolder\server.properties) `
          -replace 'online-mode=true','online-mode=false' |
          Set-Content D:\McFolder\server.properties

      - name: Verify Server Properties
        run: |
          Write-Host "===== ONLINE MODE ====="
          Select-String `
            -Path D:\McFolder\server.properties `
            -Pattern "online-mode"

      - name: Stop Minecraft
        continue-on-error: true
        run: |
          Get-Process java -ErrorAction SilentlyContinue |
          Stop-Process -Force

      - name: Set 12GB RAM
        run: |
          Set-Content D:\McFolder\user_jvm_args.txt "-Xms12G"
          Add-Content D:\McFolder\user_jvm_args.txt "-Xmx12G"

      - name: Start Server In Background
        run: |
          Start-Process `
            -FilePath "D:\McFolder\run.bat" `
            -WorkingDirectory "D:\McFolder"

          Start-Sleep -Seconds 30

      - name: Show Java Processes
        run: |
          Get-CimInstance Win32_Process |
          Where-Object {$_.Name -eq "java.exe"} |
          Select-Object ProcessId, CommandLine

      - name: Show Folder Contents
        run: |
          Write-Host "===== McFolder ====="
          dir D:\McFolder

      - name: Show Latest Log
        run: |
          if (Test-Path "D:\McFolder\logs\latest.log") {
            Write-Host "===== latest.log ====="
            Get-Content "D:\McFolder\logs\latest.log" -Tail 100
          }
          else {
            Write-Host "No latest.log found"
          }

      - name: Download Playit
        run: |
          Invoke-WebRequest `
            -Uri "https://builds.playit.gg/1.0.8/playit-windows-x86_64-signed.msi" `
            -OutFile "D:\playit.msi"

      - name: Install Playit
        run: |
          Start-Process msiexec.exe `
            -ArgumentList '/i D:\playit.msi /quiet /norestart' `
            -Wait

      - name: Verify Playit Files
        run: |
          dir "C:\Program Files\playit_gg\bin"

      - name: Start Playit
        run: |
          Start-Process `
            -FilePath "C:\Program Files\playit_gg\bin\playit.exe"

          Start-Sleep -Seconds 20

      - name: Show Playit Processes
        run: |
          Get-CimInstance Win32_Process |
          Where-Object {
            $_.Name -like "*playit*"
          } |
          Select-Object ProcessId, Name, CommandLine

      - name: Playit Version
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" version

      - name: Playit Status
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" status

      - name: Playit Secret Path
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" secret-path

      - name: Show Playit Config
        continue-on-error: true
        run: |
          Write-Host "===== playit.toml ====="

          if (Test-Path "C:\ProgramData\playit_gg\playit.toml") {
            Get-Content "C:\ProgramData\playit_gg\playit.toml"
          }
          else {
            Write-Host "playit.toml not found"
          }

      - name: Playit Help
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" --help

      - name: Search Playit Files
        continue-on-error: true
        run: |
          Write-Host "===== PLAYIT FILES ====="

          Get-ChildItem "C:\ProgramData" -Recurse -ErrorAction SilentlyContinue |
          Where-Object {
            $_.FullName -like "*playit*"
          } |
          Select-Object FullName

      - name: Playit Claim Help
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" claim --help

      - name: Playit Setup Help
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" setup --help

      - name: Playit Account Help
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" account --help

      - name: Generate Claim Code
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" claim generate

      - name: Login URL
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" account login-url

      - name: Setup Playit
        continue-on-error: true
        run: |
          & "C:\Program Files\playit_gg\bin\playit.exe" setup

      - name: Show Playit Data
        run: |
          Write-Host "===== PLAYIT DATA ====="

          Get-ChildItem `
            "C:\ProgramData\playit_gg" `
            -Recurse |
          Select-Object FullName

      - name: Keep Server Alive
        run: |
          Start-Sleep -Seconds 120

      - name: Stop Minecraft
        continue-on-error: true
        run: |
          Get-Process java -ErrorAction SilentlyContinue |
          Stop-Process -Force

      - name: Compress World
        run: |
          Compress-Archive `
            -Path "D:\McFolder\world" `
            -DestinationPath ".\saves\world.zip" `
            -Force

      - name: Commit World Save
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add saves/world.zip

          git commit -m "Automatic world save" || echo "Nothing to commit"

          git push
